name: ci
# Trigger actions on push or pull request events to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent multiple runs of the workflow for the same branch at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Provide ubuntu environment for this job
    runs-on: ubuntu-latest
    steps:
      # Checkout (clone) the repository to the GitHub runner
      - uses: actions/checkout@v4
      # Setup Java 17 with Maven caching
      - uses: actions/setup-java@v4
        with:
          # temurin JDK
          distribution: temurin
          java-version: '17'
          cache: maven
      # Build & Test the project using Maven
      - name: Build & test
        run: mvn -B verify

  # Build and push Docker image
  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      content: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # User/bot to login to GHCR, using the GitHub token for authentication
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
            # Project root dir (to find ./Dockerfile)
            context: .
            # Push image to GHCR
            push: true
            tags: |
            # Use the latest tag for the image
                ghcr.io/${{ github.repository }}:latest
            # Use the commit SHA as a tag for the image
                ghcr.io/${{ github.repository }}:${{ github.sha }}
            # Cache for faster builds
            cache-from: type=gha
            cache-to: type=gha,mode=max