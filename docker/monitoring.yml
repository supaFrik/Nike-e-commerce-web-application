services:

  prometheus:
    image: prom/prometheus:latest
    container_name: nike-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - nike-network

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: nike-mysql-exporter
    restart: unless-stopped
    ports:
      -   "9104:9104"
    volumes:
      - ./docker/mysql-exporter/.my.cnf:/cfg/.my.cnf:ro
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    depends_on:
      - prometheus
    networks:
      - nike-network

  grafana:
    image: grafana/grafana:latest
    container_name: nike-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - nike-network
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:${MAIL_HOST}"
      GF_SMTP_USER: "${MAIL_USERNAME}"
      GF_SMTP_PASSWORD: "${MAIL_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${MAIL_USERNAME}"
      GF_SMTP_FROM_NAME: "Nike Ecommerce Grafana"
      GF_SMTP_SKIP_VERIFY: "false"

networks:
  nike-network:
    external: true
    name: nike-network

volumes:
  grafana_data: