services:
  mysql-db:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nike_store}
      MYSQL_USER: ${MYSQL_USER:-nike_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nike-network
    ports:
      - "3306:3306"

  app:
    image: ghcr.io/supafrik/nike-e-commerce-web-application:latest
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      PORT: ${APP_PORT:-8080}
      MYSQL_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-nike_store}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-nike_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # ... các environment còn lại giữ nguyên ...
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - nike-network

volumes:
  mysql_data:

networks:
  nike-network:
    name: nike-network